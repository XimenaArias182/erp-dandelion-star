# render.yaml — Configuración Docker para Render (erp-dandelion-star)
services:
  # ── Aplicación Web Django + WeasyPrint ──────────────────────────
  - type: web
    name: erp-dandelion-star
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-dandelion-star-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: erp-dandelion-star-redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          type: redis
          name: erp-dandelion-star-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEFAULT_FROM_EMAIL
        value: "ERP Dandelion Star <noreply@erp-dandelion-star.com>"
      - key: ADMIN_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

  # ── Redis (Caché / Sesiones) ────────────────────────────────────
  - type: redis
    name: erp-dandelion-star-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  # ── Base de Datos PostgreSQL ────────────────────────────────────
  - name: erp-dandelion-star-db
    plan: free
    region: oregon
    databaseName: erp_db
    user: erp_user
