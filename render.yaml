# render.yaml — versión con Docker (reemplaza la versión buildpack)
services:

  - type: web
    name: erp-django-utec
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: erp-django-redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          type: redis
          name: erp-django-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "ERP Django <noreply@erp-django.com>"
      - key: ADMIN_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

  - type: worker
    name: erp-django-celery-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    startCommand: celery -A core worker -l info -Q erp_django
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: erp-django-redis
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false

  - type: worker
    name: erp-django-celery-beat
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    startCommand: celery -A core beat -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: erp-django-redis
          property: connectionString

databases:
  - name: erp-django-db
    plan: free
    region: oregon
    databaseName: erp_db
    user: erp_user

  - name: erp-django-redis
    type: redis
    plan: free
    region: oregon
